# Builds the VCV Rack plugin for every platform, runs the DSP unit tests,
# and publishes a GitHub Release when a version tag is pushed.
#
#   Every push to main and every pull request: tests + all four builds
#   (downloadable from the run's "Artifacts" section).
#   Tag push (e.g. v2.0.1): the same, then a Release with the four .vcvplugin files.
#
# To release: set "version" in plugin.json (e.g. 2.0.1), commit, then
#   git tag v2.0.1 && git push origin main v2.0.1
# The publish job fails if the tag doesn't match plugin.json's version.
#
# Based on https://github.com/qno/vcv-plugin-github-actions-example (GPL-3.0).

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  RACK_SDK_VERSION: 2.6.6

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run DSP core tests
        run: make test DESKTOP_CXX=g++

  # Windows and Linux are cross-compiled with VCV's rack-plugin-toolchain,
  # prebuilt into a community-maintained container image.
  build-win-linux:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qno/rack-plugin-toolchain-win-linux
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        platform: [win-x64, lin-x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin
        run: |
          export PLUGIN_DIR=$GITHUB_WORKSPACE
          pushd /home/build/rack-plugin-toolchain
          make plugin-build-${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: /home/build/rack-plugin-toolchain/plugin-build/*.vcvplugin
          if-no-files-found: error

  # Both Mac builds run on GitHub's Apple Silicon runner; x64 is cross-compiled.
  build-mac:
    name: mac-${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            cross: x86_64-apple-darwin
          - platform: arm64
            cross: arm64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Get Rack SDK
        run: |
          command -v zstd >/dev/null || brew install zstd  # used by `make dist`
          curl -fsSL -o "$RUNNER_TEMP/Rack-SDK.zip" \
            "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-mac-${{ matrix.platform }}.zip"
          unzip -q "$RUNNER_TEMP/Rack-SDK.zip" -d "$RUNNER_TEMP"
      - name: Build plugin
        run: |
          export RACK_DIR="$RUNNER_TEMP/Rack-SDK"
          export CROSS_COMPILE=${{ matrix.cross }}
          make dep
          make dist
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.platform }}
          path: dist/*.vcvplugin
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build-win-linux, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches plugin.json version
        run: |
          version=$(jq -r .version plugin.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match plugin.json version v$version"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: CVSpeak ${{ github.ref_name }}
          files: artifacts/*.vcvplugin
          fail_on_unmatched_files: true
          body: |
            CVSpeak VCV Rack plugin ${{ github.ref_name }}.

            **Install:** download the file for your system (`win-x64`, `lin-x64`, `mac-x64` for Intel Macs, `mac-arm64` for Apple Silicon). In Rack 2, choose **Help → Open user folder**, put the file in the `plugins-…` folder there, and restart Rack.
